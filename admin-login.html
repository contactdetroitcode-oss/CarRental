<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="CarRental - Connexion administrateur">
<title>CarRental | Administration</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);color:#fff}
.background-circle{position:fixed;width:350px;height:350px;border-radius:50%;background:rgba(37,99,235,.12);filter:blur(20px);pointer-events:none}
.circle-one{top:-120px;left:-100px}.circle-two{right:-120px;bottom:-120px;background:rgba(14,165,233,.1)}
.login-container{position:relative;width:100%;max-width:450px;z-index:2}
.login-card{width:100%;padding:40px;background:rgba(15,23,42,.94);border:1px solid rgba(255,255,255,.1);border-radius:24px;box-shadow:0 25px 70px rgba(0,0,0,.45);backdrop-filter:blur(15px)}
.logo{width:72px;height:72px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:linear-gradient(135deg,#2563eb,#0ea5e9);font-size:32px;box-shadow:0 12px 30px rgba(37,99,235,.35)}
.login-header{text-align:center;margin-bottom:30px}.login-header h1{margin-bottom:10px;font-size:28px;font-weight:700}.login-header p{color:#94a3b8;font-size:14px;line-height:1.6}
.form-group{margin-bottom:20px}.form-group label{display:block;margin-bottom:8px;font-size:14px;font-weight:600;color:#e2e8f0}
.input-wrapper{position:relative}.input-wrapper input{width:100%;height:52px;padding:0 16px;border:1px solid #334155;border-radius:12px;outline:none;background:#1e293b;color:#fff;font-size:15px;transition:.2s}.input-wrapper input::placeholder{color:#64748b}.input-wrapper input:focus{border-color:#3b82f6;background:#172033;box-shadow:0 0 0 4px rgba(59,130,246,.12)}
.password-wrapper input{padding-right:52px}.toggle-password{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:transparent;color:#94a3b8;cursor:pointer;font-size:18px}.toggle-password:hover{color:#fff}
.form-error,.form-success{display:none;margin-bottom:18px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5}.form-error{border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.1);color:#fca5a5}.form-success{border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.1);color:#86efac}.form-error.show,.form-success.show{display:block}
.login-button{width:100%;height:54px;border:0;border-radius:12px;background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}.login-button:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(37,99,235,.3)}.login-button:active{transform:translateY(0)}.login-button:disabled{cursor:not-allowed;opacity:.7;transform:none}
.login-footer{margin-top:25px;text-align:center;color:#64748b;font-size:12px;line-height:1.6}.login-footer strong{color:#94a3b8}.back-home{display:block;margin-top:18px;text-align:center;color:#60a5fa;font-size:13px;text-decoration:none;transition:.2s}.back-home:hover{color:#93c5fd;text-decoration:underline}
@media(max-width:500px){body{padding:15px}.login-card{padding:30px 22px;border-radius:20px}.logo{width:64px;height:64px;font-size:28px}.login-header h1{font-size:24px}}
</style>
</head>
<body>
<div class="background-circle circle-one"></div>
<div class="background-circle circle-two"></div>

<main class="login-container">
<section class="login-card">
<div class="logo">🚗</div>
<div class="login-header">
<h1>Administration</h1>
<p>Connectez-vous à votre espace administrateur CarRental.</p>
</div>

<div id="formError" class="form-error"></div>
<div id="formSuccess" class="form-success"></div>

<form id="adminLoginForm">
<div class="form-group">
<label for="adminEmail">Adresse email</label>
<div class="input-wrapper">
<input type="email" id="adminEmail" name="email" placeholder="admin@carrental.ma" autocomplete="email" required>
</div>
</div>

<div class="form-group">
<label for="adminPassword">Mot de passe</label>
<div class="input-wrapper password-wrapper">
<input type="password" id="adminPassword" name="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
<button type="button" id="togglePassword" class="toggle-password" aria-label="Afficher le mot de passe">👁</button>
</div>
</div>

<button type="submit" id="loginButton" class="login-button">Se connecter</button>
</form>

<a href="index.html" class="back-home">← Retour au site</a>

<div class="login-footer"><strong>CarRental</strong><br>Espace sécurisé d'administration</div>
</section>
</main>

<script>
const ADMIN_EMAIL="admin@carrental.ma",ADMIN_PASSWORD="admin123",ADMIN_SESSION_KEY="carRentalAdminLoggedIn";
const adminLoginForm=document.getElementById("adminLoginForm"),adminEmail=document.getElementById("adminEmail"),adminPassword=document.getElementById("adminPassword"),togglePassword=document.getElementById("togglePassword"),loginButton=document.getElementById("loginButton"),formError=document.getElementById("formError"),formSuccess=document.getElementById("formSuccess");

function showError(message){formSuccess.classList.remove("show");formError.textContent=message;formError.classList.add("show")}
function showSuccess(message){formError.classList.remove("show");formSuccess.textContent=message;formSuccess.classList.add("show")}
function clearMessages(){formError.classList.remove("show");formSuccess.classList.remove("show");formError.textContent="";formSuccess.textContent=""}

togglePassword.addEventListener("click",()=>{
let show=adminPassword.type==="password";
adminPassword.type=show?"text":"password";
togglePassword.textContent=show?"🙈":"👁";
togglePassword.setAttribute("aria-label",show?"Masquer le mot de passe":"Afficher le mot de passe")
});

adminLoginForm.addEventListener("submit",e=>{
e.preventDefault();clearMessages();
const email=adminEmail.value.trim().toLowerCase(),password=adminPassword.value;
if(!email){showError("Veuillez saisir votre adresse email.");adminEmail.focus();return}
if(!password){showError("Veuillez saisir votre mot de passe.");adminPassword.focus();return}
if(email!==ADMIN_EMAIL||password!==ADMIN_PASSWORD){showError("Email ou mot de passe incorrect.");adminPassword.value="";adminPassword.focus();return}
localStorage.setItem(ADMIN_SESSION_KEY,"true");
showSuccess("Connexion réussie. Redirection...");
loginButton.disabled=true;
loginButton.textContent="Connexion...";
setTimeout(()=>window.location.href="admin.html",700)
});

if(adminEmail)adminEmail.focus();
</script>
</body>
</html>
